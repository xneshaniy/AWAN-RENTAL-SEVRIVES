<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Awan Rental Service</title>
  <!--
    Export lockup for downloadable / email / social use. The mark is the
    refined inline SVG artwork; the wordmark and subtitle are live <text>
    set in Poppins (loaded via Google Fonts on the site). Brand colours are
    the existing navy (#1E3A8A), gold (#D4AF37) and charcoal (#64748B).
  -->

  <!-- Brand mark: refined sleeker silhouette, ~1.1 scale, two gold speed lines. -->
  <g transform="translate(120 130) scale(0.2333333333)">
    <rect x="24" y="24" width="552" height="552" rx="150" fill="#1E3A8A"/>

    <!-- Gold motion lines ahead of the car. -->
    <rect x="56" y="294" width="72" height="18" rx="9" fill="#D4AF37"/>
    <rect x="76" y="330" width="46" height="14" rx="7" fill="#D4AF37"/>

    <g transform="translate(300 300) scale(1.1) translate(-300 -300) translate(0 -12)">
      <!-- Off-white grand-tourer silhouette. -->
      <path d="M 124 348 C 116 340 113 328 116 316 L 124 296 C 128 288 135 283 144 281 L 188 274 C 204 260 216 248 228 238 C 250 224 276 216 302 215 L 354 215 C 374 216 392 224 408 238 L 436 260 C 454 266 470 276 480 290 C 486 298 488 308 489 318 L 486 336 C 484 345 477 350 468 350 L 124 348 Z" fill="#F8FAFC"/>

      <!-- Cabin glass: a navy band inside the white body. -->
      <path d="M 210 264 C 220 248 232 234 246 224 C 258 216 276 213 294 213 L 340 213 C 355 214 368 220 378 230 L 408 256 C 410 260 408 264 404 264 L 218 264 C 214 264 212 262 214 264 Z" fill="#1E3A8A"/>

      <!-- Wheels: navy tyre, gold rim, gold hub, navy centre. -->
      <circle cx="188" cy="355" r="49" fill="#1E3A8A"/>
      <circle cx="432" cy="355" r="49" fill="#1E3A8A"/>
      <circle cx="188" cy="355" r="40" stroke="#D4AF37" stroke-width="11"/>
      <circle cx="432" cy="355" r="40" stroke="#D4AF37" stroke-width="11"/>
      <circle cx="188" cy="355" r="13" fill="#D4AF37"/>
      <circle cx="432" cy="355" r="13" fill="#D4AF37"/>
      <circle cx="188" cy="355" r="5" fill="#1E3A8A"/>
      <circle cx="432" cy="355" r="5" fill="#1E3A8A"/>
    </g>
  </g>

  <!-- Wordmark: Awan Rental Service (Poppins bold, navy). -->
  <text
    x="300"
    y="222"
    font-family="Poppins, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#1E3A8A"
    textLength="560"
    lengthAdjust="spacingAndGlyphs"
  >Awan Rental Service</text>

  <!-- Subtitle: CAR RENTAL PAKISTAN (charcoal, letter-spaced). -->
  <text
    x="300"
    y="268"
    font-family="Poppins, sans-serif"
    font-size="24"
    font-weight="600"
    fill="#64748B"
    letter-spacing="2"
    textLength="330"
    lengthAdjust="spacingAndGlyphs"
  >CAR RENTAL PAKISTAN</text>
</svg>
